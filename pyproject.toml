[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance-arbitrage-graph"
version = "0.5.0"
description = "Paper-only causal verification engine for crypto arbitrage opportunities"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Alex Safonov"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
resonance-live-scan = "resonance_arbitrage_graph.live_scan:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
