[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance-arbitrage-graph"
version = "0.15.0"
description = "Evidence-bound pre-trade verification for autonomous financial agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Alex Safonov"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
ml-catboost = ["catboost==1.2.10"]

[project.scripts]
resonance-live-scan = "resonance_arbitrage_graph.live_scan:main"
resonance-replay-benchmark = "resonance_arbitrage_graph.replay_cli:main"
resonance-holdout-calibration = "resonance_arbitrage_graph.holdout_cli:main"
resonance-joint-holdout-calibration = "resonance_arbitrage_graph.joint_holdout_cli:main"
resonance-walk-forward-stability = "resonance_arbitrage_graph.walk_forward_cli:main"
resonance-stability-decomposition = "resonance_arbitrage_graph.stability_decomposition_cli:main"
resonance-policy-promotion = "resonance_arbitrage_graph.policy_promotion_cli:main"
resonance-policy-registry = "resonance_arbitrage_graph.policy_registry_cli:main"
resonance-policy-authority = "resonance_arbitrage_graph.policy_authority_cli:main"
resonance-catboost-walk-forward = "resonance_arbitrage_graph.predictive_catboost_cli:main"
resonance-real-market-corpus = "resonance_arbitrage_graph.real_market_corpus_cli:main"
resonance-corpus-runner = "resonance_arbitrage_graph.corpus_runner_cli:main"
resonance-opportunity-truth-benchmark = "resonance_arbitrage_graph.opportunity_truth_benchmark_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
