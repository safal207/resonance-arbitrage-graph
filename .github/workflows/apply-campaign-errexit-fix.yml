name: Apply campaign errexit fix

on:
  push:
    branches:
      - fix/corpus-campaign-errexit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/corpus-campaign-errexit
      - name: Patch workflow and add regression
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/corpus-campaign-001.yml')
          text = workflow_path.read_text(encoding='utf-8')
          first = '            resonance-corpus-campaign-step \\\n'
          replacement = '            set +e\n            resonance-corpus-campaign-step \\\n'
          if replacement not in text:
              if first not in text:
                  raise SystemExit('campaign command anchor not found')
              text = text.replace(first, replacement, 1)

          second = '            local code=$?\n\n            if [[ $code -eq 0 ]]; then\n'
          second_replacement = '            local code=$?\n            set -e\n\n            if [[ $code -eq 0 ]]; then\n'
          if second_replacement not in text:
              if second not in text:
                  raise SystemExit('campaign exit-code anchor not found')
              text = text.replace(second, second_replacement, 1)
          workflow_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_corpus_campaign_workflow.py')
          test_path.write_text(
              "from pathlib import Path\n\n\n"
              "def test_profile_failure_is_captured_despite_github_errexit():\n"
              "    workflow = Path('.github/workflows/corpus-campaign-001.yml').read_text(encoding='utf-8')\n"
              "    assert 'set +e\\n            resonance-corpus-campaign-step' in workflow\n"
              "    assert 'local code=$?\\n            set -e' in workflow\n",
              encoding='utf-8',
          )

          Path('.github/workflows/apply-campaign-errexit-fix.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/corpus-campaign-001.yml tests/test_corpus_campaign_workflow.py
          git rm --cached .github/workflows/apply-campaign-errexit-fix.yml
          git commit -m "fix: isolate campaign profile failures under GitHub errexit"
          git push origin HEAD:fix/corpus-campaign-errexit
