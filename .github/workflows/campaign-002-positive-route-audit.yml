name: Campaign 002 positive routes read-only audit

on:
  push:
    branches: [agent/campaign-002-positive-routes]
    paths:
      - ".github/workflows/campaign-002-positive-route-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: data/corpus-campaign-002
          path: evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/pyproject.toml
      - name: Install verifier locally
        run: python -m pip install -e ./code
      - name: Reproduce funnel and group 226 routes by direction and UTC
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          
          from resonance_arbitrage_graph.opportunity_funnel import _build_row, build_opportunity_funnel
          from resonance_arbitrage_graph.real_market_corpus import load_corpus
          
          corpus = load_corpus(Path("evidence/campaign/002/corpus.json"))
          saved = json.loads(Path("evidence/campaign/002/opportunity-funnel-v0.1.json").read_text())
          report = build_opportunity_funnel(corpus)
          if report.to_envelope() != saved:
              raise SystemExit("FAIL CLOSED: corpus does not reproduce preserved funnel")
          
          rows = []
          terminal = 0
          for case in corpus.to_replay_bundle().collapsed_cases():
              if not case.outcome.terminal:
                  continue
              terminal += 1
              row = _build_row(case)
              if not row.gross_positive:
                  continue
              edges = case.build_route()
              path = [edges[0].src] + [edge.dst for edge in edges]
              others = sorted(set(path) - {"BTC", "USD"})
              if len(edges) != 3 or path[0] != "USD" or path[-1] != "USD" or len(others) != 1:
                  raise SystemExit(f"Unexpected triangle for {row.operation_id}: {path}")
              ts = datetime.fromtimestamp(case.evaluation_time_ms / 1000.0, timezone.utc)
              rows.append({
                  "operation_id": row.operation_id,
                  "route_id": row.route_id,
                  "asset": others[0],
                  "direction": "via_BTC" if path[1] == "BTC" else "via_asset",
                  "route": " -> ".join(path),
                  "timestamp_utc": ts.isoformat(timespec="milliseconds").replace("+00:00", "Z"),
                  "date_utc": ts.strftime("%Y-%m-%d"),
                  "hour_window_utc": ts.strftime("%Y-%m-%d %H:00"),
                  "hour_of_day_utc": ts.hour,
                  "gross_edge_bps": row.gross_edge_bps,
                  "expected_net_edge_bps": row.expected_net_edge_bps,
                  "modeled_cost_drag_bps": row.modeled_cost_drag_bps,
              })
          rows.sort(key=lambda x: (x["timestamp_utc"], x["operation_id"]))
          if terminal != report.overall.counts.candidate_cycles:
              raise SystemExit("Terminal count differs from verified funnel")
          if len(rows) != report.overall.counts.gross_positive:
              raise SystemExit("Positive count differs from verified funnel")
          if any(x["expected_net_edge_bps"] > 0 for x in rows):
              raise SystemExit("Unexpected net-positive route in frozen sample")
          
          by_asset = Counter(x["asset"] for x in rows)
          by_route = Counter(x["route"] for x in rows)
          by_day = Counter(x["date_utc"] for x in rows)
          by_hour = Counter(x["hour_window_utc"] for x in rows)
          by_utc_clock_hour = Counter(x["hour_of_day_utc"] for x in rows)
          unique_times = len({x["timestamp_utc"] for x in rows})
          result = {
              "schema": "resonance.verify.campaign-002-positive-route-audit/v0.1",
              "diagnostic_only": True,
              "paper_only": True,
              "source_branch": "data/corpus-campaign-002",
              "corpus_sha256": report.source_sha256,
              "funnel_sha256": report.sha256,
              "terminal_cycles": terminal,
              "positive_gross_cycles": len(rows),
              "distinct_positive_decision_times": unique_times,
              "first_utc": rows[0]["timestamp_utc"] if rows else None,
              "last_utc": rows[-1]["timestamp_utc"] if rows else None,
              "by_asset": dict(sorted(by_asset.items())),
              "by_route": dict(sorted(by_route.items())),
              "by_utc_day": dict(sorted(by_day.items())),
              "by_utc_hour_window": dict(sorted(by_hour.items())),
              "by_utc_hour_of_day": {f"{h:02d}": by_utc_clock_hour[h] for h in range(24)},
              "positive_operations": rows,
          }
          out = Path("results")
          out.mkdir(exist_ok=True)
          (out / "campaign_002_positive_routes.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          
          lines = [
              "# Campaign 002: read-only gross-positive route and UTC time audit",
              "",
              f"- Corpus SHA-256: {report.source_sha256}",
              f"- Funnel SHA-256: {report.sha256}",
              f"- Terminal routes: {terminal}",
              f"- Gross-positive, structurally eligible routes: {len(rows)}",
              f"- Distinct positive decision times: {unique_times}",
              f"- Earliest UTC: {result['first_utc']}",
              f"- Latest UTC: {result['last_utc']}",
              "- This is a historical paper-only diagnostic; no execution or profitability claims.",
              "",
              "## By asset and direction",
              "",
              "| Asset | USD -> BTC -> asset -> USD | USD -> asset -> BTC -> USD | Total |",
              "|---|---:|---:|---:|",
          ]
          for asset, count in sorted(by_asset.items(), key=lambda x: (-x[1], x[0])):
              lines.append(f"| {asset} | {by_route.get(f'USD -> BTC -> {asset} -> USD', 0)} | {by_route.get(f'USD -> {asset} -> BTC -> USD', 0)} | {count} |")
          lines.extend(["", "## By UTC day", "", "| Date | Count |", "|---|---:|"])
          for key, count in sorted(by_day.items()):
              lines.append(f"| {key} | {count} |")
          lines.extend(["", "## By UTC hour of day", "", "| Hour | Count |", "|---|---:|"])
          for h in range(24):
              lines.append(f"| {h:02d} | {by_utc_clock_hour[h]} |")
          lines.extend(["", "## Highest-count UTC hourly windows", "", "| Window | Count |", "|---|---:|"])
          for key, count in sorted(by_hour.items(), key=lambda x: (-x[1], x[0]))[:30]:
              lines.append(f"| {key} | {count} |")
          lines.extend(["", "All windows and individual timestamps appear in the JSON artifact.",
                        "Time clustering is descriptive only; paired routes and market snapshots are not independent."])
          text = "\n".join(lines) + "\n"
          (out / "campaign_002_positive_routes.md").write_text(text, encoding="utf-8")
          print(text)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write(text)
          PY
      - name: Upload report as audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: campaign-002-positive-routes
          path: results/
          if-no-files-found: error
          retention-days: 30
