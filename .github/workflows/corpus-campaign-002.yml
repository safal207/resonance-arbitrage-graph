name: Corpus Campaign 002

on:
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/corpus-campaign-002.yml"

permissions:
  contents: write

concurrency:
  group: resonance-corpus-campaign-002
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout verifier code
        uses: actions/checkout@v4
        with:
          ref: main
          path: code

      - name: Checkout append-only campaign data branch
        uses: actions/checkout@v4
        with:
          ref: data/corpus-campaign-002
          path: campaign-data
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install RESONANCE Verify
        working-directory: code
        run: python -m pip install -e ".[test]"

      - name: Check campaign stop conditions
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/campaign-data/campaign/002"
          corpus="$root/corpus.json"
          report="$root/opportunity-truth-v0.2.json"
          complete=false
          paused=false
          report_valid=false
          terminal_operations=0

          if [[ -f "$corpus" ]]; then
            terminal_operations="$(python - "$corpus" <<'PY'
          from pathlib import Path
          import sys
          from resonance_arbitrage_graph.corpus_runner import terminal_operation_count
          from resonance_arbitrage_graph.real_market_corpus import load_corpus

          print(terminal_operation_count(load_corpus(Path(sys.argv[1]))))
          PY
            )"
          fi

          if [[ -f "$report" && -f "$corpus" ]]; then
            if resonance-opportunity-truth-benchmark verify \
              "$corpus" "$report" >"$RUNNER_TEMP/campaign-gate-verify.log" 2>&1; then
              report_valid=true
              status="$(jq -r '.payload.claim_status // "NOT_READY"' "$report")"
              if [[ "$status" == "INTERNAL_EVIDENCE_READY" ]]; then
                complete=true
              fi
            else
              echo "::warning::Stored benchmark does not bind the current corpus; collection will continue and rebuild it."
              cat "$RUNNER_TEMP/campaign-gate-verify.log" || true
            fi
          elif [[ -f "$report" ]]; then
            echo "::warning::Stored benchmark exists without its bound corpus; it will not be trusted."
          fi

          if [[ "$complete" != "true" && "$terminal_operations" -ge 2000 ]]; then
            paused=true
          fi

          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "paused=$paused" >> "$GITHUB_OUTPUT"
          echo "report_valid=$report_valid" >> "$GITHUB_OUTPUT"
          echo "terminal_operations=$terminal_operations" >> "$GITHUB_OUTPUT"

      - name: Capture public market evidence
        id: collect
        if: steps.gate.outputs.complete != 'true' && steps.gate.outputs.paused != 'true'
        shell: bash
        run: |
          set -uo pipefail

          root="$GITHUB_WORKSPACE/campaign-data/campaign/002"
          run_root="$root/receipts/$GITHUB_RUN_ID"
          log_root="$root/logs/$GITHUB_RUN_ID"
          corpus="$root/corpus.json"
          replay="$root/replay.json"
          mkdir -p "$run_root" "$log_root"

          if [[ -f "$corpus" ]]; then
            before_file_sha="$(sha256sum "$corpus" | awk '{print $1}')"
          else
            before_file_sha="missing"
          fi

          successes=0
          failures=0

          run_profile() {
            local name="$1"
            local amount="$2"
            shift 2
            local receipt="$run_root/$name.json"
            local log="$log_root/$name.log"

            echo "Running profile: $name"
            set +e
            resonance-corpus-campaign-step \
              --corpus "$corpus" \
              --replay-output "$replay" \
              --receipt-output "$receipt" \
              --campaign-id corpus-campaign-002 \
              --venue kraken \
              --start-asset USD \
              --amount "$amount" \
              --fee-bps 10 \
              --slippage-bps 2 \
              --gas-bps 0 \
              --execute-net-edge-bps 5 \
              --observe-net-edge-bps 0 \
              --horizon-ms 60000 \
              --max-hops 3 \
              --max-cases 2 \
              --rolling-samples 6 \
              --rolling-interval-ms 1000 \
              --rolling-horizon-ms 10000 \
              --rolling-min-coverage-ratio 0.5 \
              --min-terminal-operations 100 \
              --min-training-rows 20 \
              --min-decision-batches 20 \
              --min-effective-decision-batches 10 \
              --min-temporal-span-ms 3600000 \
              --min-distinct-routes 3 \
              --min-effective-routes 2 \
              --min-distinct-route-markets 3 \
              --min-distinct-regimes 2 \
              "$@" >"$log" 2>&1
            local code=$?
            set -e

            if [[ $code -eq 0 ]]; then
              successes=$((successes + 1))
              echo "profile=$name status=success"
            else
              failures=$((failures + 1))
              echo "profile=$name status=failed exit_code=$code"
              tail -n 40 "$log" || true
              rm -f "$receipt"
            fi
          }

          # Normal profiles use a micro-notional so the measurement can test
          # route economics instead of systematically failing top-book depth.
          run_profile eth-usd 25 \
            --pair "BTC/USD:BTC:USD" \
            --pair "ETH/BTC:ETH:BTC" \
            --pair "ETH/USD:ETH:USD"

          run_profile sol-usd 25 \
            --pair "BTC/USD:BTC:USD" \
            --pair "SOL/BTC:SOL:BTC" \
            --pair "SOL/USD:SOL:USD"

          run_profile ada-usd 25 \
            --pair "BTC/USD:BTC:USD" \
            --pair "ADA/BTC:ADA:BTC" \
            --pair "ADA/USD:ADA:USD"

          run_profile xrp-usd 25 \
            --pair "BTC/USD:BTC:USD" \
            --pair "XRP/BTC:XRP:BTC" \
            --pair "XRP/USD:XRP:USD"

          run_profile ltc-usd 25 \
            --pair "BTC/USD:BTC:USD" \
            --pair "LTC/BTC:LTC:BTC" \
            --pair "LTC/USD:LTC:USD"

          # Preserve an explicit negative-control profile for capacity gating.
          run_profile ada-capacity-stress 250000 \
            --pair "BTC/USD:BTC:USD" \
            --pair "ADA/BTC:ADA:BTC" \
            --pair "ADA/USD:ADA:USD"

          if [[ -f "$corpus" ]]; then
            after_file_sha="$(sha256sum "$corpus" | awk '{print $1}')"
          else
            after_file_sha="missing"
          fi

          progress=false
          if [[ $successes -gt 0 || "$before_file_sha" != "$after_file_sha" ]]; then
            progress=true
            rm -f \
              "$root/opportunity-truth-v0.2.json" \
              "$root/opportunity-truth-v0.2.md"
          fi

          echo "successes=$successes" >> "$GITHUB_OUTPUT"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          echo "progress=$progress" >> "$GITHUB_OUTPUT"
          echo "corpus_exists=$([[ -f "$corpus" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build and fully verify Opportunity Truth Benchmark v0.2
        if: steps.collect.outputs.corpus_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/campaign-data/campaign/002"
          report_tmp="$RUNNER_TEMP/opportunity-truth-v0.2.json"
          markdown_tmp="$RUNNER_TEMP/opportunity-truth-v0.2.md"
          rm -f "$report_tmp" "$markdown_tmp"

          resonance-opportunity-truth-benchmark build "$root/corpus.json" \
            --min-terminal-operations 100 \
            --min-truth-population 30 \
            --min-decision-batches 20 \
            --min-effective-decision-batches 10 \
            --min-temporal-span-ms 3600000 \
            --min-distinct-routes 3 \
            --min-effective-routes 2 \
            --min-distinct-route-markets 3 \
            --min-distinct-regimes 2 \
            --output "$report_tmp" \
            --markdown-output "$markdown_tmp"

          resonance-opportunity-truth-benchmark verify \
            "$root/corpus.json" \
            "$report_tmp"

          mv "$report_tmp" "$root/opportunity-truth-v0.2.json"
          mv "$markdown_tmp" "$root/opportunity-truth-v0.2.md"

      - name: Write campaign summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RESONANCE Verify — Corpus Campaign 002"
            echo
            echo "- Campaign 001: frozen diagnostic corpus"
            echo "- Trusted pre-run report: ${{ steps.gate.outputs.report_valid }}"
            echo "- Campaign complete: ${{ steps.gate.outputs.complete }}"
            echo "- Campaign paused at evidence budget: ${{ steps.gate.outputs.paused }}"
            echo "- Terminal operations before run: ${{ steps.gate.outputs.terminal_operations }}"
            echo "- Successful profiles: ${{ steps.collect.outputs.successes || '0' }}"
            echo "- Failed profiles: ${{ steps.collect.outputs.failures || '0' }}"
            echo "- Evidence progress: ${{ steps.collect.outputs.progress || 'false' }}"
            echo "- Data branch: \`data/corpus-campaign-002\`"
            echo "- Safety: public data, paper-only, no keys or orders"
            if [[ -f "$GITHUB_WORKSPACE/campaign-data/campaign/002/opportunity-truth-v0.2.md" ]]; then
              echo
              sed -n '1,28p' "$GITHUB_WORKSPACE/campaign-data/campaign/002/opportunity-truth-v0.2.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit append-only campaign evidence
        if: always() && steps.collect.outputs.progress == 'true'
        working-directory: campaign-data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaign/002
          if git diff --cached --quiet; then
            echo "No campaign evidence changes to commit"
            exit 0
          fi
          git commit -m "data(campaign-002): run $GITHUB_RUN_ID [skip ci]"
          git push origin HEAD:data/corpus-campaign-002

      - name: Upload reproducible campaign evidence
        if: always() && steps.collect.outputs.corpus_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resonance-corpus-campaign-002-${{ github.run_id }}
          path: campaign-data/campaign/002
          if-no-files-found: error
          retention-days: 30

      - name: Stop successfully when evidence gate has passed
        if: steps.gate.outputs.complete == 'true'
        run: echo "Campaign is complete; INTERNAL_EVIDENCE_READY was already reached."

      - name: Stop successfully at campaign evidence budget
        if: steps.gate.outputs.paused == 'true'
        run: |
          echo "Campaign paused after 2,000 terminal operations without readiness."
          echo "Product review is required before collecting more evidence."

      - name: Fail closed on zero progress
        if: >-
          always() &&
          steps.gate.outputs.complete != 'true' &&
          steps.gate.outputs.paused != 'true' &&
          steps.collect.outputs.progress != 'true'
        run: |
          echo "No campaign profile succeeded and no pending evidence was recovered."
          exit 1
