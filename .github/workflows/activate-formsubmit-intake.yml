name: Probe FormSubmit AJAX activation endpoint

on:
  push:
    branches: [ops/browser-formsubmit-activation]
    paths:
      - ".github/workflows/activate-formsubmit-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Send one clearly labeled AJAX activation test
        shell: bash
        run: |
          set -euo pipefail
          response_file="formsubmit-ajax-response.txt"
          status="$({
            curl --silent --show-error --location \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST "https://formsubmit.co/ajax/safal0645@gmail.com" \
              --header "Accept: application/json" \
              --header "Referer: https://safal207.github.io/resonance-arbitrage-graph/" \
              --form "_captcha=false" \
              --form "_subject=[ACTIVATION TEST] RESONANCE Verify founding-list intake" \
              --form "_template=table" \
              --form "_url=https://safal207.github.io/resonance-arbitrage-graph/" \
              --form "email=safal0645@gmail.com" \
              --form "company=RESONANCE activation test" \
              --form "role=System test" \
              --form "integration=Form intake" \
              --form "workflow=One-time AJAX activation probe. Not a prospect lead." \
              --form "failure=ACTIVATION_TEST" \
              --form "sample=Not applicable" \
              --form "pilot_interest=Not applicable" \
              --form "consent=Explicit test consent" \
              --form "test_submission=true" \
              --form "source_page=https://safal207.github.io/resonance-arbitrage-graph/"
          } || true)"

          echo "HTTP status: $status"
          cat "$response_file" || true

          {
            echo "## FormSubmit AJAX activation probe"
            echo
            echo "- HTTP status: **$status**"
            echo
            if [[ "$status" == "200" || "$status" == "201" || "$status" == "202" ]]; then
              echo "The endpoint accepted the activation test. Check Gmail for the confirmation message."
            else
              echo "The endpoint did not accept a headless request. A normal human-browser submission remains required; no anti-bot bypass was attempted."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formsubmit-ajax-activation-probe
          path: formsubmit-ajax-response.txt
          if-no-files-found: warn
          retention-days: 3
