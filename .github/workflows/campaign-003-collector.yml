name: Campaign 003 — preregistered temporal holdout collection

# The schedule is inert on a PR branch: GitHub only schedules files on main.
# When reviewed and merged, the runtime guard permits only Dec 1–28, 2026,
# with one strictly bounded sample per UTC slot. Never force-push evidence.
on:
  push:
    branches: [agent/campaign-003-collector]
    paths:
      - ".github/workflows/campaign-003-collector.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 1,16 1-28 12 *"

permissions:
  contents: read

concurrency:
  group: resonance-campaign-003-sampling
  cancel-in-progress: false

jobs:
  dry-run-validation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Show bounded collection gate without fetching public quotes
        run: |
          python -m resonance_arbitrage_graph.campaign003_collection_gate \
            --corpus "$RUNNER_TEMP/no-campaign-003-data.json"
          echo "No collection is performed by push or manual dispatch."

  capture:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - name: Checkout verified code at scheduled main revision
        uses: actions/checkout@v4
        with:
          path: code
          ref: ${{ github.sha }}

      - name: Checkout immutable-origin Campaign 003 evidence branch
        uses: actions/checkout@v4
        with:
          path: campaign-data
          ref: data/corpus-campaign-003
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install paper-only scanner
        run: python -m pip install -e ./code

      - name: Check strict UTC window, canonical corpus and prior slots
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python -m resonance_arbitrage_graph.campaign003_collection_gate \
            --corpus "$GITHUB_WORKSPACE/campaign-data/campaign/003/corpus.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Pin acquisition code SHA before first capture
        if: steps.gate.outputs.collect == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/campaign-data/campaign/003"
          mkdir -p "$root"
          pin="$root/collector-source-sha.txt"
          actual="$(git -C "$GITHUB_WORKSPACE/code" rev-parse HEAD)"
          if [[ -f "$pin" ]]; then
            recorded="$(cat "$pin")"
            if [[ "$recorded" != "$actual" ]]; then
              echo "::error::Collector code SHA drift detected. Do not collect mixed-version evidence."
              exit 1
            fi
          else
            printf '%s\\n' "$actual" > "$pin"
          fi

      - name: Capture exactly one attempt per frozen market profile
        id: collect
        if: steps.gate.outputs.collect == 'true'
        shell: bash
        run: |
          set -uo pipefail
          root="$GITHUB_WORKSPACE/campaign-data/campaign/003"
          mkdir -p "$root/receipts/$GITHUB_RUN_ID" "$root/logs/$GITHUB_RUN_ID"
          corpus="$root/corpus.json"
          replay="$root/replay.json"
          ok=true

          capture_profile() {
            local asset="$1"
            shift
            local receipt="$root/receipts/$GITHUB_RUN_ID/$asset.json"
            local log="$root/logs/$GITHUB_RUN_ID/$asset.log"
            echo "Capturing $asset at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            resonance-corpus-campaign-step \
              --corpus "$corpus" \
              --replay-output "$replay" \
              --receipt-output "$receipt" \
              --campaign-id corpus-campaign-003 \
              --venue kraken \
              --start-asset USD \
              --amount 25 \
              --fee-bps 10 \
              --slippage-bps 2 \
              --gas-bps 0 \
              --execute-net-edge-bps 5 \
              --observe-net-edge-bps 0 \
              --max-quote-age-ms 3000 \
              --max-route-latency-ms 5000 \
              --min-success-probability 0.75 \
              --horizon-ms 60000 \
              --max-hops 3 \
              --max-cases 2 \
              --rolling-samples 6 \
              --rolling-interval-ms 1000 \
              --rolling-horizon-ms 10000 \
              --rolling-min-coverage-ratio 0.5 \
              --min-terminal-operations 100 \
              --min-training-rows 20 \
              --min-decision-batches 20 \
              --min-effective-decision-batches 10 \
              --min-temporal-span-ms 3600000 \
              --min-distinct-routes 3 \
              --min-effective-routes 2 \
              --min-distinct-route-markets 3 \
              --min-distinct-regimes 2 \
              "$@" > "$log" 2>&1
            local result=$?
            if [[ "$result" -ne 0 ]]; then
              echo "::error::Campaign 003 $asset failed; no same-slot retry is allowed."
              tail -n 25 "$log" || true
              return 1
            fi
            return 0
          }

          capture_profile eth --pair "BTC/USD:BTC:USD" --pair "ETH/BTC:ETH:BTC" --pair "ETH/USD:ETH:USD" || ok=false
          if [[ "$ok" == 'true' ]]; then
            capture_profile sol --pair "BTC/USD:BTC:USD" --pair "SOL/BTC:SOL:BTC" --pair "SOL/USD:SOL:USD" || ok=false
          fi
          if [[ "$ok" == 'true' ]]; then
            capture_profile ada --pair "BTC/USD:BTC:USD" --pair "ADA/BTC:ADA:BTC" --pair "ADA/USD:ADA:USD" || ok=false
          fi
          if [[ "$ok" == 'true' ]]; then
            capture_profile xrp --pair "BTC/USD:BTC:USD" --pair "XRP/BTC:XRP:BTC" --pair "XRP/USD:XRP:USD" || ok=false
          fi
          if [[ "$ok" == 'true' ]]; then
            capture_profile ltc --pair "BTC/USD:BTC:USD" --pair "LTC/BTC:LTC:BTC" --pair "LTC/USD:LTC:USD" || ok=false
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Verify exactly ten new terminal operations without policy drift
        id: verify
        if: steps.gate.outputs.collect == 'true'
        shell: bash
        env:
          SLOT_DATE: ${{ steps.gate.outputs.date }}
          SLOT_HOUR: ${{ steps.gate.outputs.hour }}
          BEFORE: ${{ steps.gate.outputs.before }}
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/campaign-data/campaign/003/corpus.json" <<'PY'
          import os
          import sys
          from pathlib import Path
          from resonance_arbitrage_graph.real_market_corpus import load_corpus
          from resonance_arbitrage_graph.temporal_holdout import extract_holdout

          corpus = load_corpus(Path(sys.argv[1]))
          rows = extract_holdout(corpus)
          previous = int(os.environ["BEFORE"])
          if len(rows) != previous + 10:
              raise SystemExit(f"Expected 10 new rows, found {len(rows) - previous}")
          new = rows[previous:]
          if any(row.date_utc.isoformat() != os.environ["SLOT_DATE"]
                 or row.hour_utc != int(os.environ["SLOT_HOUR"]) for row in new):
              raise SystemExit("One or more new decisions landed outside the intended UTC slot")
          if len({(r.asset, r.direction) for r in new}) != 10:
              raise SystemExit("The slot does not contain all ten unique preregistered routes")
          print(f"Verified 10/10 terminal cases; corpus SHA-256 {corpus.sha256}")
          PY

      - name: Preserve all evidence including partial/failed samples
        id: persist
        if: always() && steps.gate.outputs.collect == 'true'
        working-directory: campaign-data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaign/003
          if git diff --cached --quiet; then
            echo "No new evidence was captured"
          else
            git commit -m "data(campaign-003): slot $GITHUB_RUN_ID [skip ci]"
            git push origin HEAD:data/corpus-campaign-003
          fi

      - name: Backup full evidence if persistence or collection fails
        if: failure() && steps.gate.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: campaign-003-recovery-${{ github.run_id }}
          path: campaign-data/campaign/003/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload capture audit receipts without trading actions
        if: always() && steps.gate.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: campaign-003-capture-${{ github.run_id }}
          path: |
            campaign-data/campaign/003/receipts/
            campaign-data/campaign/003/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed on collection/verification or evidence commit failures
        if: always() && steps.gate.outputs.collect == 'true'
        env:
          COLLECT_OK: ${{ steps.collect.outputs.ok }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: |
          if [[ "$COLLECT_OK" != 'true' || "$VERIFY_OUTCOME" != 'success' || "$PERSIST_OUTCOME" != 'success' ]]; then
            echo "::error::Incomplete Campaign 003 slot. Do not retry or backfill this slot."
            exit 1
          fi

      - name: Summarize scheduled window decision
        if: always()
        env:
          GATE_STATUS: ${{ steps.gate.outputs.status }}
          BEFORE: ${{ steps.gate.outputs.before }}
        run: |
          echo "### Campaign 003 scheduled paper-only sample" >> "$GITHUB_STEP_SUMMARY"
          echo "Gate: ${GATE_STATUS:-NOT_EVALUATED}; previous cycles: ${BEFORE:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "No exchange credentials, API orders, wallets, or real capital." >> "$GITHUB_STEP_SUMMARY"
